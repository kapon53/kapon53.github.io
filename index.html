<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapon | Portfolyo</title>
    <style>
        /* Terminal / Hacker Tema */
        :root {
            --bg-main: #050505; /* Neredeyse tam siyah */
            --text-main: #00FF41; /* Matrix yeşili */
            --text-muted: #008F11; /* Koyu yeşil alt metinler */
            --border-color: #00FF41;
        }

        body {
            /* Gerçekçi terminal fontları */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
            border-bottom: 1px dashed var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 3em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Başlığın başına > koyar */
        h1::before {
            content: "> ";
            color: var(--text-muted);
        }

        /* Başlığın sonuna yanıp sönen _ imleci ekler */
        h1::after {
            content: "_";
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        p.subtitle {
            font-size: 1.2em;
            color: var(--text-muted);
            max-width: 600px;
            margin: 15px auto;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8em;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 40px;
            display: inline-block;
            text-transform: uppercase;
        }

        /* Bölüm başlığına klasör görünümü verir */
        .section-title::before {
            content: "./";
            color: var(--text-muted);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background-color: #000;
            padding: 30px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            /* Retro gölge efekti */
            box-shadow: 5px 5px 0px var(--text-muted);
        }

        .project-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px var(--text-main);
        }

        .project-title {
            font-size: 1.5em;
            margin: 0 0 15px 0;
            text-transform: uppercase;
        }
        
        .project-title::before {
            content: "[ ";
        }
        
        .project-title::after {
            content: " ]";
        }

        .project-desc {
            color: var(--text-muted);
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tag {
            color: var(--bg-main);
            background-color: var(--text-muted);
            padding: 4px 10px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .play-btn {
            display: inline-block;
            text-align: center;
            padding: 12px 24px;
            background: transparent;
            color: var(--text-main);
            text-decoration: none;
            font-weight: bold;
            border: 1px solid var(--text-main);
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .play-btn:hover {
            background: var(--text-main);
            color: var(--bg-main);
        }

        .play-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>Kapon</h1>
        <p class="subtitle">Kendince takılan biri...</p>
    </header>

    <div class="container">
        <h2 class="section-title">Projeler_ve_Uygulamalar</h2>
        
        <div class="projects-grid">
            
            <!-- Proje 1 -->
            <div class="project-card">
                <h3 class="project-title">Minigame</h3>
                <p class="project-desc">Birazcik sinir eden bir minik oyun.</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/minigame" class="play-btn">Oyna.exe</a>
            </div>

            <!-- Proje 2 -->
            <div class="project-card">
                <h3 class="project-title">Irem_1</h3>
                <p class="project-desc">Bakalim dedigin kadar miymissin.</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/ikincioyun" class="play-btn">Oyna.exe</a>
            </div>

        </div>
    </div>

</body>
</html>
