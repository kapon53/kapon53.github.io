<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapon | Portfolyo</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
            background-color: #000000;
            border-bottom: 2px solid #ffffff; 
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
            font-size: 3.5em;
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: bold;
        }

        p.subtitle {
            font-size: 1.1em;
            color: #888888;
            max-width: 600px;
            margin: 15px auto 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.5em;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 10px 20px;
            display: inline-block;
            border-radius: 6px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background-color: #0a0a0c;
            padding: 30px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* --- 1. OYUN: MİNİGAME (YEŞİL) --- */
        .card-green {
            border: 3px solid #00ff66;
        }
        .card-green .tag {
            color: #00ff66;
            background: rgba(0, 255, 102, 0.1);
        }
        .card-green .play-btn {
            background: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
        }
        .card-green .play-btn:hover {
            background: #00ff66;
            color: #000000;
        }
        .card-green:active, .card-green .play-btn:active {
            box-shadow: 0 0 25px 5px #00ff66;
            transform: scale(0.98);
        }

        /* --- 2. OYUN: ❤️ (MOR) --- */
        .card-purple {
            border: 3px solid #b026ff;
        }
        .card-purple .tag {
            color: #b026ff;
            background: rgba(176, 38, 255, 0.1);
        }
        .card-purple .play-btn {
            background: transparent;
            color: #b026ff;
            border: 2px solid #b026ff;
        }
        .card-purple .play-btn:hover {
            background: #b026ff;
            color: #000000;
        }
        .card-purple:active, .card-purple .play-btn:active {
            box-shadow: 0 0 25px 5px #b026ff;
            transform: scale(0.98);
        }

        /* --- 3. OYUN: TETRİS (BUZ MAVİSİ) --- */
        .card-cyan {
            border: 3px solid #00f3ff;
        }
        .card-cyan .tag {
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.1);
        }
        .card-cyan .play-btn {
            background: transparent;
            color: #00f3ff;
            border: 2px solid #00f3ff;
        }
        .card-cyan .play-btn:hover {
            background: #00f3ff;
            color: #000000;
        }
        .card-cyan:active, .card-cyan .play-btn:active {
            box-shadow: 0 0 25px 5px #00f3ff;
            transform: scale(0.98);
        }

        .project-title {
            font-size: 1.5em;
            color: #ffffff;
            margin: 0 0 15px 0;
        }

        .project-desc {
            color: #cccccc;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .play-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>KAPON</h1>
        <p class="subtitle">Kendince takılan biri</p>
    </header>

    <div class="container">
        <div class="section-title">Proje ve Uygulamalar</div>
        
        <div class="projects-grid">
            
            <!-- Proje 1 -->
            <div class="project-card card-green">
                <h3 class="project-title">Minigame</h3>
                <p class="project-desc">Birazcık sinir eden bir minik oyun 😅</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/minigame" class="play-btn">Oyunu Oyna 😅</a>
            </div>

            <!-- Proje 2 -->
            <div class="project-card card-purple">
                <h3 class="project-title">❤️</h3>
                <p class="project-desc">Bakalım dediğin kadarmıymışsın🤔🤔</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/ikincioyun" class="play-btn">Oyunu Oyna 🚀</a>
            </div>

            <!-- Proje 3: TETRİS -->
            <div class="project-card card-cyan">
                <h3 class="project-title">Tetris</h3>
                <p class="project-desc">Klasik blok yerleştirme heyecanı 🧊</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <!-- DİKKAT: Eğer Tetris'in GitHub depo adını farklı koyduysan aşağıdaki "tetris-oyunu" kısmını ona göre değiştir. -->
                <a href="/tetris-oyunu" class="play-btn">Oyunu Oyna 🕹️</a>
            </div>

        </div>
    </div>

</body>
</html>
