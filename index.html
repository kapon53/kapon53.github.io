<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyundasın | Kapon</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000; /* Tam odak için simsiyah arka plan */
            color: #ffffff;
            /* Oyun oynarken sayfanın aşağı/yukarı kaymasını engellemek için: */
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- Üst Bar (Navigasyon ve Kullanıcı Bilgisi) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(10,10,12,0.9) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
        }

        .back-btn {
            color: #888;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn:hover {
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255,51,102,0.5);
            transform: translateX(-5px);
        }

        .player-info {
            font-size: 1.1em;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-name {
            color: #00f3ff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,243,255,0.3);
            letter-spacing: 1px;
        }

        /* --- Oyun Alanı (Canvas/Iframe Konteyneri) --- */
        .game-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        /* Arkadaki hafif parlama efekti */
        .game-glow {
            position: absolute;
            width: 800px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,51,102,0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .game-container {
            width: 800px; /* Standart web oyunu genişliği */
            height: 600px;
            background-color: #0a0a0c;
            border: 2px solid rgba(255, 51, 102, 0.3);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(255,51,102,0.15);
            position: relative;
            z-index: 1;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Eğer oyunu Canvas ile çiziyorsan bu stil Canvas'a uygulanacak */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Alt Bilgi / Kontroller --- */
        .controls-info {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            z-index: 1;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .control-label {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .keys {
            display: flex;
            gap: 8px;
        }

        .key {
            background-color: #111;
            border: 2px solid #333;
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 0 #000;
        }
    </style>
</head>
<body>

    <!-- Üst Bar -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">
            <span>◄</span> Ana Sayfaya Dön
        </a>
        <div class="player-info">
            Oyuncu: <span class="player-name" id="display-username">Yükleniyor...</span>
        </div>
    </div>

    <!-- Oyun Ekranı -->
    <div class="game-wrapper">
        <div class="game-glow"></div>
        
        <div class="game-container" id="game-frame">
            <!-- 
                BURAYA OYUNUN GELECEK. 
                Örneğin: <canvas id="gameCanvas"></canvas> 
                veya başka bir HTML sayfasını çekiyorsan: <iframe src="platform-oyunu.html" width="100%" height="100%" frameborder="0"></iframe> 
            -->
            
            <h2 style="color: #444; font-weight: normal; user-select: none;">Oyun Yükleniyor...</h2>
        </div>

        <!-- Tuş Kontrolleri Tasarımı -->
        <div class="controls-info">
            <div class="control-group">
                <span class="control-label">Hareket</span>
                <div class="keys">
                    <div class="key">A</div>
                    <div class="key">D</div>
                </div>
            </div>
            <div class="control-group">
                <span class="control-label">Zıplama</span>
                <div class="keys">
                    <div class="key" style="width: 120px;">SPACE</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sayfa yüklendiğinde LocalStorage'dan oyuncunun ismini çek
        window.onload = () => {
            const savedName = localStorage.getItem("kapon_username");
            const displayElement = document.getElementById('display-username');
            
            if(savedName) {
                displayElement.textContent = savedName;
            } else {
                displayElement.textContent = "Misafir Oyuncu";
            }
        };

        /* 
           Oyunun JavaScript kodlarını (fizik motoru, requestAnimationFrame döngüleri vs.)
           bu script etiketinin altına ekleyebilir veya harici bir .js dosyası olarak bağlayabilirsin.
        */
    </script>
</body>
</html>
