<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapon | Portfolyo</title>
    <style>
        /* Modern ve Profesyonel Tema */
        :root {
            --bg-main: #0B1120; /* Koyu lacivert/siyah arka plan */
            --bg-card: #1E293B; /* Kartların rengi */
            --text-main: #F8FAFC; /* Ana metin rengi (beyaza yakın) */
            --text-muted: #94A3B8; /* Alt başlık rengi (gri) */
            --accent: #38BDF8; /* Vurgu rengi: Buz Mavisi */
            --accent-hover: #0EA5E9;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
            background: radial-gradient(circle at top, #1e293b 0%, #0b1120 100%);
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 3em;
            color: var(--text-main);
            letter-spacing: -1px;
            font-weight: 700;
        }

        /* İsmine ufak bir renk vurgusu */
        h1 span {
            color: var(--accent);
        }

        p.subtitle {
            font-size: 1.2em;
            color: var(--text-muted);
            max-width: 600px;
            margin: 15px auto;
            font-weight: 300;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8em;
            color: var(--text-main);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 40px;
            display: inline-block;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* Fareyle kartın üzerine gelindiğindeki şık efekt */
        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.15);
        }

        .project-title {
            font-size: 1.5em;
            color: var(--text-main);
            margin: 0 0 15px 0;
        }

        .project-desc {
            color: var(--text-muted);
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .play-btn {
            display: inline-block;
            text-align: center;
            padding: 12px 24px;
            background-color: var(--accent);
            color: #0F172A;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.1s;
        }

        .play-btn:hover {
            background-color: var(--accent-hover);
        }

        .play-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>Kap<span>on</span></h1>
        <p class="subtitle">Kendince takılan biri</p>
    </header>

    <div class="container">
        <h2 class="section-title">Proje ve Uygulamalar</h2>
        
        <div class="projects-grid">
            
            <!-- Proje 1 -->
            <div class="project-card">
                <h3 class="project-title">Minigame</h3>
                <p class="project-desc">Birazcık sinir eden bir minik oyun 😅</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/minigame" class="play-btn">Oyunu Oyna 😅</a>
            </div>

            <!-- Proje 2 -->
            <div class="project-card">
                <h3 class="project-title">❤️</h3>
                <p class="project-desc">Bakalım dediğin kadarmıymışsın🤔🤔</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/ikincioyun" class="play-btn">Oyunu Oyna 🚀</a>
            </div>

        </div>
    </div>

</body>
</html>
