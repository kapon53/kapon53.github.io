<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapon | Portfolyo</title>
    <style>
        /* Neon / Siberpunk (Oyuncu Tarzı) Tema */
        :root {
            --bg-main: #09090b; 
            --bg-card: #121216; 
            --text-main: #f1f5f9; 
            --text-muted: #94a3b8; 
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --border-color: #27272a;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            /* İnce bir siber ağ (grid) deseni */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
            background: linear-gradient(180deg, rgba(255,0,127,0.05) 0%, rgba(9,9,11,1) 100%);
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 4px 20px rgba(255, 0, 127, 0.15);
        }

        h1 {
            margin: 0;
            font-size: 3.5em;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        h1 span {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
        }

        p.subtitle {
            font-size: 1.2em;
            color: var(--text-muted);
            max-width: 600px;
            margin: 15px auto;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8em;
            color: #fff;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 10px;
            margin-bottom: 40px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
            box-shadow: 0 4px 0 -2px var(--neon-cyan);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Kartın üstünde ince neon çizgi */
        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.05);
        }

        .project-card:hover::before {
            opacity: 1;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .project-title {
            font-size: 1.5em;
            color: #fff;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .project-desc {
            color: var(--text-muted);
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(0, 243, 255, 0.05);
            color: var(--neon-cyan);
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            border: 1px solid rgba(0, 243, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .play-btn {
            display: inline-block;
            text-align: center;
            padding: 12px 24px;
            background: transparent;
            color: var(--neon-pink);
            text-decoration: none;
            font-weight: 700;
            border: 2px solid var(--neon-pink);
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .play-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>Kap<span>on</span></h1>
        <p class="subtitle">Kendince takılan biri</p>
    </header>

    <div class="container">
        <h2 class="section-title">Proje ve Uygulamalar</h2>
        
        <div class="projects-grid">
            
            <!-- Proje 1 -->
            <div class="project-card">
                <h3 class="project-title">Minigame</h3>
                <p class="project-desc">Birazcık sinir eden bir minik oyun 😅</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/minigame" class="play-btn">Oyunu Oyna 😅</a>
            </div>

            <!-- Proje 2 -->
            <div class="project-card">
                <h3 class="project-title">❤️</h3>
                <p class="project-desc">Bakalım dediğin kadarmıymışsın🤔🤔</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/ikincioyun" class="play-btn">Oyunu Oyna 🚀</a>
            </div>

        </div>
    </div>

</body>
</html>
