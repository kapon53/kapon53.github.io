<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapon | Portfolyo</title>
    <style>
        /* Açık Tema (Minimalist) */
        :root {
            --bg-main: #f8fafc; /* Uçuk gri/beyaz ferah arka plan */
            --bg-card: #ffffff; /* Bembeyaz kartlar */
            --text-main: #0f172a; /* Koyu lacivert/siyah metin */
            --text-muted: #64748b; /* Gri alt başlıklar */
            --accent: #2563eb; /* Zarif bir mavi vurgu */
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 3.2em;
            color: var(--text-main);
            letter-spacing: -1px;
            font-weight: 800;
        }

        h1 span {
            color: var(--accent);
        }

        p.subtitle {
            font-size: 1.2em;
            color: var(--text-muted);
            max-width: 600px;
            margin: 15px auto;
            font-weight: 400;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8em;
            color: var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 40px;
            display: inline-block;
            font-weight: 700;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            /* Çok hafif, zarif bir gölge */
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* Üzerine gelince kart hafifçe kalkar ve gölgesi belirginleşir */
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }

        .project-title {
            font-size: 1.5em;
            color: var(--text-main);
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .project-desc {
            color: var(--text-muted);
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .play-btn {
            display: inline-block;
            text-align: center;
            padding: 12px 24px;
            background-color: var(--text-main); /* Buton başlangıçta siyah/koyu lacivert */
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.1s;
        }

        /* Butonun üzerine gelince şık bir maviye döner */
        .play-btn:hover {
            background-color: var(--accent);
        }

        .play-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>Kap<span>on</span></h1>
        <p class="subtitle">Kendince takılan biri</p>
    </header>

    <div class="container">
        <h2 class="section-title">Proje ve Uygulamalar</h2>
        
        <div class="projects-grid">
            
            <!-- Proje 1 -->
            <div class="project-card">
                <h3 class="project-title">Minigame</h3>
                <p class="project-desc">Birazcık sinir eden bir minik oyun 😅</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/minigame" class="play-btn">Oyunu Oyna</a>
            </div>

            <!-- Proje 2 -->
            <div class="project-card">
                <h3 class="project-title">❤️</h3>
                <p class="project-desc">Bakalım dediğin kadarmıymışsın🤔🤔</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/ikincioyun" class="play-btn">Oyunu Oyna</a>
            </div>

        </div>
    </div>

</body>
</html>
