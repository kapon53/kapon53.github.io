<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapon | Portfolyo</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000; /* Simsiyah Arka Plan */
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
            background-color: #000000;
            border-bottom: 1px solid #151515;
        }

        h1 {
            margin: 0;
            font-size: 3.5em;
            color: #ffffff; /* Beyaz Kapon Yazısı */
            letter-spacing: 2px;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 1.2em;
            color: #777777;
            max-width: 600px;
            margin: 15px auto;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8em;
            color: #ffffff;
            border-bottom: 2px solid #222;
            padding-bottom: 10px;
            margin-bottom: 40px;
            display: inline-block;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background-color: #0a0a0c;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1a1a1e;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- 1. OYUN: MİNİGAME (YEŞİL LED EFEKTİ) --- */
        .card-green:hover {
            border-color: #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.25);
            transform: translateY(-5px);
        }
        .card-green .tag {
            color: #00ff66;
            background: rgba(0, 255, 102, 0.08);
            border: 1px solid rgba(0, 255, 102, 0.2);
        }
        .card-green .play-btn {
            background: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
        }
        .card-green .play-btn:hover {
            background: #00ff66;
            color: #000000;
            box-shadow: 0 0 20px #00ff66;
        }

        /* --- 2. OYUN: ❤️ (MOR LED EFEKTİ) --- */
        .card-purple:hover {
            border-color: #b026ff;
            box-shadow: 0 0 25px rgba(176, 38, 255, 0.25);
            transform: translateY(-5px);
        }
        .card-purple .tag {
            color: #b026ff;
            background: rgba(176, 38, 255, 0.08);
            border: 1px solid rgba(176, 38, 255, 0.2);
        }
        .card-purple .play-btn {
            background: transparent;
            color: #b026ff;
            border: 2px solid #b026ff;
        }
        .card-purple .play-btn:hover {
            background: #b026ff;
            color: #000000;
            box-shadow: 0 0 20px #b026ff;
        }

        .project-title {
            font-size: 1.5em;
            color: #ffffff;
            margin: 0 0 15px 0;
        }

        .project-desc {
            color: #888888;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .play-btn {
            display: inline-block;
            text-align: center;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .play-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>KAPON</h1>
        <p class="subtitle">Kendince takılan biri</p>
    </header>

    <div class="container">
        <h2 class="section-title">Proje ve Uygulamalar</h2>
        
        <div class="projects-grid">
            
            <!-- Proje 1: Yeşil LED Tema -->
            <div class="project-card card-green">
                <h3 class="project-title">Minigame</h3>
                <p class="project-desc">Birazcık sinir eden bir minik oyun 😅</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/minigame" class="play-btn">Oyunu Oyna 😅</a>
            </div>

            <!-- Proje 2: Mor LED Tema -->
            <div class="project-card card-purple">
                <h3 class="project-title">❤️</h3>
                <p class="project-desc">Bakalım dediğin kadarmıymışsın🤔🤔</p>
                <div class="tags">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                </div>
                <a href="/ikincioyun" class="play-btn">Oyunu Oyna 🚀</a>
            </div>

        </div>
    </div>

</body>
</html>
